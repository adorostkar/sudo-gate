[package]
name = "sudo-gate"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
urlencoding = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
nix = { version = "0.29", features = ["user", "fs"] }

[lib]
name = "sudo_gate"
path = "src/lib.rs"

[[bin]]
name = "sudo-gate"
path = "src/bin/sudo-gate.rs"

[[bin]]
name = "sudo-gated"
path = "src/bin/sudo-gated.rs"
